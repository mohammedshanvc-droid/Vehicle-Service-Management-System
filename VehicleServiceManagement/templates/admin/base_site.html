{% extends "admin/base_site.html" %}

{% block extrastyle %}
{{ block.super }}
<style>
  /* =====================================================================
     Vehicle Service Management - site-wide admin theme
     Works on every admin page: dashboard, lists, forms, login, delete, etc.
     Approach: remap Django's own colour variables, then polish shapes.
     ===================================================================== */

  /* ---------- Light theme ---------- */
  :root,
  html[data-theme="light"] {
    color-scheme: light;

    /* my own tokens (also used by the dashboard index.html) */
    --n-bg: #F4F6FA;
    --n-card: #FFFFFF;
    --n-ink: #1B2430;
    --n-muted: #66758A;
    --n-line: #E3E8EF;
    --n-hover: #F6F8FC;
    --n-primary: #2F5BEA;
    --n-primary-ink: #FFFFFF;
    --n-soft: #EAF0FF;
    --n-add: #1F8A55;
    --n-change: #2F5BEA;
    --n-delete: #C8442F;
    --n-shadow: 0 1px 2px rgba(27, 36, 48, 0.06);

    /* Django admin variables */
    --primary: #2F5BEA;
    --secondary: #EAF0FF;
    --accent: #2F5BEA;
    --primary-fg: #FFFFFF;
    --body-fg: #1B2430;
    --body-bg: #F4F6FA;
    --body-quiet-color: #66758A;
    --body-loud-color: #1B2430;
    --header-color: #66758A;
    --header-branding-color: #1B2430;
    --header-bg: #FFFFFF;
    --header-link-color: #2F5BEA;
    --breadcrumbs-fg: #66758A;
    --breadcrumbs-link-fg: #2F5BEA;
    --breadcrumbs-bg: #F4F6FA;
    --link-fg: #2F5BEA;
    --link-hover-color: #1B2430;
    --link-selected-fg: #1B2430;
    --hairline-color: #E3E8EF;
    --border-color: #D5DCE5;
    --error-fg: #C8442F;
    --message-success-bg: #E6F6EC;
    --message-warning-bg: #FFF4DB;
    --message-error-bg: #FDE9E5;
    --darkened-bg: #F6F8FC;
    --selected-bg: #EAF0FF;
    --selected-row: #EAF0FF;
    --button-fg: #FFFFFF;
    --button-bg: #2F5BEA;
    --button-hover-bg: #2449C2;
    --default-button-bg: #2F5BEA;
    --default-button-hover-bg: #2449C2;
    --close-button-bg: #66758A;
    --close-button-hover-bg: #1B2430;
    --delete-button-bg: #C8442F;
    --delete-button-hover-bg: #A93623;
    --object-tools-fg: #FFFFFF;
    --object-tools-bg: #66758A;
    --object-tools-hover-bg: #1B2430;
  }

  /* ---------- Dark theme (system preference) ---------- */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]),
    html:not([data-theme="light"]) {
      color-scheme: dark;

      --n-bg: #0F141B;
      --n-card: #171E27;
      --n-ink: #E7ECF3;
      --n-muted: #8C9AAD;
      --n-line: #263040;
      --n-hover: #1B2430;
      --n-primary: #6E93FF;
      --n-primary-ink: #0F141B;
      --n-soft: #1E2A44;
      --n-add: #5FC38A;
      --n-change: #8BA8FF;
      --n-delete: #F08A7F;
      --n-shadow: none;

      --primary: #6E93FF;
      --secondary: #1E2A44;
      --accent: #6E93FF;
      --primary-fg: #0F141B;
      --body-fg: #E7ECF3;
      --body-bg: #0F141B;
      --body-quiet-color: #8C9AAD;
      --body-loud-color: #FFFFFF;
      --header-color: #8C9AAD;
      --header-branding-color: #E7ECF3;
      --header-bg: #171E27;
      --header-link-color: #8BA8FF;
      --breadcrumbs-fg: #8C9AAD;
      --breadcrumbs-link-fg: #8BA8FF;
      --breadcrumbs-bg: #0F141B;
      --link-fg: #8BA8FF;
      --link-hover-color: #FFFFFF;
      --link-selected-fg: #FFFFFF;
      --hairline-color: #263040;
      --border-color: #324055;
      --error-fg: #F08A7F;
      --message-success-bg: #16301F;
      --message-warning-bg: #3A2F12;
      --message-error-bg: #3A1A16;
      --darkened-bg: #1B2430;
      --selected-bg: #1E2A44;
      --selected-row: #1E2A44;
      --button-fg: #0F141B;
      --button-bg: #6E93FF;
      --button-hover-bg: #8BA8FF;
      --default-button-bg: #6E93FF;
      --default-button-hover-bg: #8BA8FF;
      --close-button-bg: #4A596D;
      --close-button-hover-bg: #66758A;
      --delete-button-bg: #E2705F;
      --delete-button-hover-bg: #F08A7F;
      --object-tools-fg: #E7ECF3;
      --object-tools-bg: #324055;
      --object-tools-hover-bg: #425169;
    }
  }

  /* ---------- Dark theme (manual toggle) ---------- */
  html[data-theme="dark"] {
    color-scheme: dark;

    --n-bg: #0F141B;
    --n-card: #171E27;
    --n-ink: #E7ECF3;
    --n-muted: #8C9AAD;
    --n-line: #263040;
    --n-hover: #1B2430;
    --n-primary: #6E93FF;
    --n-primary-ink: #0F141B;
    --n-soft: #1E2A44;
    --n-add: #5FC38A;
    --n-change: #8BA8FF;
    --n-delete: #F08A7F;
    --n-shadow: none;

    --primary: #6E93FF;
    --secondary: #1E2A44;
    --accent: #6E93FF;
    --primary-fg: #0F141B;
    --body-fg: #E7ECF3;
    --body-bg: #0F141B;
    --body-quiet-color: #8C9AAD;
    --body-loud-color: #FFFFFF;
    --header-color: #8C9AAD;
    --header-branding-color: #E7ECF3;
    --header-bg: #171E27;
    --header-link-color: #8BA8FF;
    --breadcrumbs-fg: #8C9AAD;
    --breadcrumbs-link-fg: #8BA8FF;
    --breadcrumbs-bg: #0F141B;
    --link-fg: #8BA8FF;
    --link-hover-color: #FFFFFF;
    --link-selected-fg: #FFFFFF;
    --hairline-color: #263040;
    --border-color: #324055;
    --error-fg: #F08A7F;
    --message-success-bg: #16301F;
    --message-warning-bg: #3A2F12;
    --message-error-bg: #3A1A16;
    --darkened-bg: #1B2430;
    --selected-bg: #1E2A44;
    --selected-row: #1E2A44;
    --button-fg: #0F141B;
    --button-bg: #6E93FF;
    --button-hover-bg: #8BA8FF;
    --default-button-bg: #6E93FF;
    --default-button-hover-bg: #8BA8FF;
    --close-button-bg: #4A596D;
    --close-button-hover-bg: #66758A;
    --delete-button-bg: #E2705F;
    --delete-button-hover-bg: #F08A7F;
    --object-tools-fg: #E7ECF3;
    --object-tools-bg: #324055;
    --object-tools-hover-bg: #425169;
  }

  /* =====================================================================
     Base
     ===================================================================== */
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 15px;
    background: var(--n-bg);
    color: var(--n-ink);
  }
  #content h1 {
    margin: 0 0 20px;
    font-size: 28px;
    font-weight: 650;
    color: var(--n-ink);
  }
  #content h2 { color: var(--n-ink); }
  a:focus-visible,
  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--n-primary);
    outline-offset: 2px;
  }

  /* =====================================================================
     Header, breadcrumbs, sidebar
     ===================================================================== */
  #header {
    padding: 14px 40px;
    background: var(--n-card);
    color: var(--n-muted);
    border-bottom: 1px solid var(--n-line);
    box-shadow: var(--n-shadow);
  }
  #header #branding h1,
  #header #site-name,
  #header #site-name a:link,
  #header #site-name a:visited,
  #header #branding h1 a:link,
  #header #branding h1 a:visited {
    font-size: 20px;
    font-weight: 600;
    color: var(--n-ink);
  }
  #user-tools {
    font-size: 13px;
    text-transform: none;
    letter-spacing: 0;
  }
  #header a:link,
  #header a:visited,
  #header #logout-form button { color: var(--n-primary); }
  #header a:hover,
  #header #logout-form button:hover { color: var(--n-ink); }

  div.breadcrumbs {
    padding: 12px 40px;
    background: var(--n-bg);
    color: var(--n-muted);
    border-bottom: 1px solid var(--n-line);
    font-size: 13px;
    text-transform: none;
  }
  div.breadcrumbs a:link,
  div.breadcrumbs a:visited { color: var(--n-primary); }

  #nav-sidebar,
  .toggle-nav-sidebar {
    background: var(--n-card);
    border-color: var(--n-line);
  }
  #nav-sidebar tr.current-model { background: var(--n-soft); }

  /* =====================================================================
     Modules (cards), fieldsets, inlines
     ===================================================================== */
  .module,
  fieldset.module {
    background: var(--n-card);
    border: 1px solid var(--n-line);
    border-radius: 12px;
    box-shadow: var(--n-shadow);
    overflow: hidden;
  }
  .module h2,
  .module caption,
  .inline-group h2 {
    padding: 14px 18px;
    background: var(--n-card);
    color: var(--n-ink);
    border-bottom: 1px solid var(--n-line);
    font-size: 15px;
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
  }
  .module h2 a:link,
  .module h2 a:visited,
  .module caption a:link,
  .module caption a:visited { color: var(--n-ink); }
  .module h2 a:hover,
  .module caption a:hover { color: var(--n-primary); }
  .module table { width: 100%; }
  .module td,
  .module th { border-color: var(--n-line); }

  .form-row { border-bottom: 1px solid var(--n-line); }
  .aligned label { font-weight: 500; color: var(--n-ink); }
  .help,
  form .help { color: var(--n-muted); }

  /* =====================================================================
     Form controls
     ===================================================================== */
  input[type="text"],
  input[type="password"],
  input[type="email"],
  input[type="url"],
  input[type="number"],
  input[type="tel"],
  input[type="date"],
  input[type="time"],
  input[type="search"],
  textarea,
  select,
  .vTextField {
    padding: 7px 10px;
    background: var(--n-card);
    color: var(--n-ink);
    border: 1px solid var(--border-color);
    border-radius: 8px;
  }
  input[type="text"]:focus,
  input[type="password"]:focus,
  input[type="email"]:focus,
  input[type="url"]:focus,
  input[type="number"]:focus,
  input[type="tel"]:focus,
  input[type="date"]:focus,
  input[type="time"]:focus,
  input[type="search"]:focus,
  textarea:focus,
  select:focus {
    border-color: var(--n-primary);
    box-shadow: 0 0 0 3px var(--n-soft);
    outline: 0;
  }

  /* =====================================================================
     Buttons and object tools
     ===================================================================== */
  .button,
  input[type="submit"],
  input[type="button"],
  .submit-row input,
  a.button {
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
  }
  .submit-row {
    padding: 12px 16px;
    background: var(--n-card);
    border: 1px solid var(--n-line);
    border-radius: 12px;
    box-shadow: var(--n-shadow);
  }
  .object-tools a:link,
  .object-tools a:visited {
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
  }

  /* =====================================================================
     Change list: search, table, filters, pagination
     ===================================================================== */
  #changelist #toolbar {
    padding: 12px 16px;
    background: var(--n-card);
    border: 1px solid var(--n-line);
    border-radius: 12px;
    box-shadow: var(--n-shadow);
  }
  #changelist .actions {
    background: transparent;
    border: 0;
    padding: 10px 0;
  }

  #changelist .results {
    background: var(--n-card);
    border: 1px solid var(--n-line);
    border-radius: 12px;
    box-shadow: var(--n-shadow);
  }
  #result_list { width: 100%; border-collapse: collapse; }
  #result_list thead th {
    padding: 12px 14px;
    background: var(--n-card);
    color: var(--n-muted);
    border: 0;
    border-bottom: 1px solid var(--n-line);
    font-size: 13px;
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
  }
  #result_list thead th a:link,
  #result_list thead th a:visited { color: var(--n-muted); }
  #result_list thead th.sorted a,
  #result_list thead th a:hover { color: var(--n-ink); }
  #result_list tbody td,
  #result_list tbody th {
    padding: 12px 14px;
    background: var(--n-card);
    border-bottom: 1px solid var(--n-line);
  }
  #result_list tbody tr:last-child td,
  #result_list tbody tr:last-child th { border-bottom: 0; }
  #result_list tbody tr:hover td,
  #result_list tbody tr:hover th { background: var(--n-hover); }
  #result_list tbody tr.selected td,
  #result_list tbody tr.selected th { background: var(--n-soft); }

  #changelist-filter {
    background: var(--n-card);
    border: 1px solid var(--n-line);
    border-radius: 12px;
    box-shadow: var(--n-shadow);
    overflow: hidden;
  }
  #changelist-filter h2 {
    margin: 0;
    padding: 14px 16px;
    background: var(--n-card);
    color: var(--n-ink);
    border-bottom: 1px solid var(--n-line);
    font-size: 15px;
    text-transform: none;
    letter-spacing: 0;
  }
  #changelist-filter h3 { color: var(--n-muted); font-weight: 600; }
  #changelist-filter li.selected a { color: var(--n-primary); font-weight: 600; }

  .paginator {
    background: transparent;
    border: 0;
    color: var(--n-muted);
  }
  .paginator a:link,
  .paginator a:visited { border-radius: 6px; }

  /* =====================================================================
     Messages
     ===================================================================== */
  ul.messagelist li {
    margin: 0 0 8px;
    padding: 12px 18px 12px 52px;
    border-radius: 10px;
    color: var(--n-ink);
    font-size: 14px;
  }

  /* =====================================================================
     Login page
     ===================================================================== */
  .login #container {
    margin: 10vh auto 0;
    background: var(--n-card);
    border: 1px solid var(--n-line);
    border-radius: 14px;
    box-shadow: var(--n-shadow);
    overflow: hidden;
  }
  .login #header {
    padding: 22px 24px 14px;
    text-align: center;
    border-bottom: 0;
    box-shadow: none;
  }
  .login #content { padding: 8px 28px 28px; }
  .login .form-row { border-bottom: 0; }
  .login .form-row label { display: block; margin-bottom: 6px; }
  .login .form-row input { width: 100%; box-sizing: border-box; }
  .login .submit-row {
    padding: 12px 0 0;
    background: none;
    border: 0;
    box-shadow: none;
  }
  .login .submit-row input { width: 100%; }

  /* =====================================================================
     Small screens
     ===================================================================== */
  @media (max-width: 767px) {
    #header { padding: 12px 16px; }
    div.breadcrumbs { padding: 10px 16px; }
    #content h1 { font-size: 24px; }
  }
</style>
{% endblock %}
