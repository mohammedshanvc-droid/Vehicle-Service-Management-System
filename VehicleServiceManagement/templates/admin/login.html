{% extends "admin/login.html" %}

{% block extrastyle %}
{{ block.super }}
<style>
  /* ---------- Tokens (light) ---------- */
  :root,
  html[data-theme="light"] {
    color-scheme: light;
    --n-bg: #F4F6FA;
    --n-card: #FFFFFF;
    --n-ink: #1B2430;
    --n-muted: #66758A;
    --n-line: #E3E8EF;
    --n-field: #FFFFFF;
    --n-field-line: #D5DCE5;
    --n-primary: #2F5BEA;
    --n-primary-hover: #2449C2;
    --n-primary-ink: #FFFFFF;
    --n-soft: #EAF0FF;
    --n-error-bg: #FDE9E5;
    --n-error: #B23A26;
    --n-shadow: 0 8px 30px rgba(27, 36, 48, 0.08);
  }

  /* ---------- Tokens (dark, system preference) ---------- */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]),
    html:not([data-theme="light"]) {
      color-scheme: dark;
      --n-bg: #0F141B;
      --n-card: #171E27;
      --n-ink: #E7ECF3;
      --n-muted: #8C9AAD;
      --n-line: #263040;
      --n-field: #0F141B;
      --n-field-line: #324055;
      --n-primary: #6E93FF;
      --n-primary-hover: #8BA8FF;
      --n-primary-ink: #0F141B;
      --n-soft: #1E2A44;
      --n-error-bg: #3A1A16;
      --n-error: #F08A7F;
      --n-shadow: none;
    }
  }

  /* ---------- Tokens (dark, manual toggle) ---------- */
  html[data-theme="dark"] {
    color-scheme: dark;
    --n-bg: #0F141B;
    --n-card: #171E27;
    --n-ink: #E7ECF3;
    --n-muted: #8C9AAD;
    --n-line: #263040;
    --n-field: #0F141B;
    --n-field-line: #324055;
    --n-primary: #6E93FF;
    --n-primary-hover: #8BA8FF;
    --n-primary-ink: #0F141B;
    --n-soft: #1E2A44;
    --n-error-bg: #3A1A16;
    --n-error: #F08A7F;
    --n-shadow: none;
  }

  /* ---------- Page ---------- */
  body.login {
    background: var(--n-bg);
    color: var(--n-ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }

  /* ---------- Card ---------- */
  body.login #container {
    width: 400px;
    max-width: calc(100% - 32px);
    min-width: 0;
    margin: 12vh auto 0;
    background: var(--n-card);
    border: 1px solid var(--n-line);
    border-radius: 14px;
    box-shadow: var(--n-shadow);
    overflow: hidden;
  }

  /* ---------- Header inside the card ---------- */
  body.login #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    height: auto;
    padding: 24px 28px 4px;
    background: transparent;
    border: 0;
    box-shadow: none;
  }
  body.login #header #branding h1,
  body.login #header #site-name,
  body.login #header #site-name a:link,
  body.login #header #site-name a:visited {
    margin: 0;
    font-size: 22px;
    font-weight: 650;
    line-height: 1.25;
    color: var(--n-ink);
    text-decoration: none;
  }
  body.login .theme-toggle { color: var(--n-muted); }
  body.login .theme-toggle svg { fill: var(--n-muted); }
  body.login .theme-toggle:hover svg { fill: var(--n-ink); }

  body.login #content { padding: 0 28px 28px; }
  body.login #content-main { width: 100%; }

  body.login .vsm-login-sub {
    margin: 0 0 20px;
    font-size: 14px;
    line-height: 1.5;
    color: var(--n-muted);
  }

  /* ---------- Fields ---------- */
  body.login #login-form .form-row {
    float: none;
    width: 100%;
    padding: 0 0 16px;
    border: 0;
  }
  body.login #login-form .form-row label {
    display: block;
    margin: 0 0 6px;
    padding: 0;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--n-ink);
  }
  body.login #login-form .form-row input[type="text"],
  body.login #login-form .form-row input[type="password"] {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 11px 12px;
    background: var(--n-field);
    color: var(--n-ink);
    border: 1px solid var(--n-field-line);
    border-radius: 8px;
    font-size: 15px;
  }
  body.login #login-form .form-row input[type="text"]:focus,
  body.login #login-form .form-row input[type="password"]:focus {
    border-color: var(--n-primary);
    box-shadow: 0 0 0 3px var(--n-soft);
    outline: 0;
  }

  /* ---------- Errors ---------- */
  body.login .errornote,
  body.login ul.errorlist {
    margin: 0 0 16px;
    padding: 10px 14px;
    background: var(--n-error-bg);
    color: var(--n-error);
    border: 0;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
  }
  body.login .form-row ul.errorlist { margin: 0 0 8px; }

  /* ---------- Button and links ---------- */
  body.login #login-form .submit-row {
    clear: both;
    margin: 0;
    padding: 4px 0 0;
    background: none;
    border: 0;
    box-shadow: none;
    text-align: center;
  }
  body.login #login-form .submit-row input[type="submit"] {
    width: 100%;
    padding: 12px 16px;
    background: var(--n-primary);
    color: var(--n-primary-ink);
    border: 0;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  body.login #login-form .submit-row input[type="submit"]:hover,
  body.login #login-form .submit-row input[type="submit"]:focus-visible {
    background: var(--n-primary-hover);
  }
  body.login #login-form .submit-row input[type="submit"]:focus-visible {
    outline: 2px solid var(--n-primary);
    outline-offset: 2px;
  }

  body.login .password-reset-link {
    margin: 0 0 16px;
    text-align: center;
    font-size: 14px;
  }
  body.login .password-reset-link a:link,
  body.login .password-reset-link a:visited { color: var(--n-primary); }
  body.login .password-reset-link a:hover { color: var(--n-ink); }
</style>
{% endblock %}

{% block content %}
<p class="vsm-login-sub">Sign in to manage customers, service bookings and staff.</p>
{{ block.super }}
{% endblock %}
