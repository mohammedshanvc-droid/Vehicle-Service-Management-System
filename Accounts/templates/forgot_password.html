<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.75)),
                url('/media/vehicle_images/loginnew.jpg');
            background-size: cover;
            background-position: center;
        }

        .login-card {
            width: 380px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.20);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #cccccc;
            font-size: 13px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: white;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: none;
            outline: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 14px;
            margin-bottom: 20px;
        }

        input::placeholder {
            color: #cccccc;
        }

        .error {
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid rgba(255, 80, 80, 0.5);
            color: #ff8585;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #4f8cff;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #3678e8;
        }

        .back-login {
            text-align: center;
            margin-top: 20px;
        }

        .back-login a {
            color: #58a6ff;
            text-decoration: none;
            font-size: 13px;
        }

        .back-login a:hover {
            color: white;
            text-decoration: underline;
        }

    </style>
</head>

<body>

    <div class="login-card">

        <h2>Forgot Password</h2>

        <p class="subtitle">
            Enter your staff username to reset your password
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required
            >

            <button type="submit">
                Continue
            </button>

        </form>

        <div class="back-login">
            <a href="{% url 'user_login' %}">
                Back to Staff Login
            </a>
        </div>

    </div>

</body>
</html>
