<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: "Poppins", sans-serif;

            background-image:
                linear-gradient(
                    90deg,
                    rgba(3, 10, 36, 0.35),
                    rgba(3, 10, 36, 0.55)
                ),
                url("/media/vehicle_images/loginnew.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: white;
        }


        .login-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: flex-end;

            padding: 40px 8%;

            position: relative;

            overflow: hidden;
        }


        /* HOME BUTTON */

        .home-button {

            position: absolute;

            top: 28px;

            left: 8%;

            z-index: 3;

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 9px 16px;

            border-radius: 8px;

            border:
                1px solid
                rgba(255, 255, 255, 0.30);

            background:
                rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(10px);

            -webkit-backdrop-filter: blur(10px);

            color: white;

            text-decoration: none;

            font-size: 13px;

            font-weight: 500;

            transition: 0.2s;
        }


        .home-button svg {

            width: 15px;

            height: 15px;

            fill: none;

            stroke: currentColor;

            stroke-width: 2;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        .home-button:hover {

            background:
                rgba(255, 255, 255, 0.22);
        }


        .home-button:focus-visible {

            outline: 2px solid #58a6ff;

            outline-offset: 3px;
        }


        .brand-content {

            position: absolute;

            left: 8%;

            top: 50%;

            transform: translateY(-50%);

            max-width: 480px;
        }


        .brand-name {

            font-size: 15px;

            font-style: italic;

            font-weight: 600;

            letter-spacing: 1px;

            margin-bottom: 25px;
        }


        .brand-name span {

            color: #0a7cff;

        }


        .brand-content h1 {

            font-size: clamp(40px, 5vw, 62px);

            font-weight: 600;

            font-style: italic;

            line-height: 1.1;

            margin-bottom: 15px;

            text-shadow:
                0 5px 25px rgba(0, 0, 0, 0.35);
        }


        .brand-content p {

            font-size: 18px;

            font-weight: 300;

            font-style: italic;

            color: rgba(255, 255, 255, 0.85);

            line-height: 1.6;

        }


        .login-card {

            position: relative;

            z-index: 2;

            width: 350px;

            padding: 32px 30px;

            border-radius: 18px;

            background:
                rgba(255, 255, 255, 0.13);

            border:
                1px solid rgba(255, 255, 255, 0.30);

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.40),

                inset 0 1px 1px
                rgba(255, 255, 255, 0.25);
        }


        .login-card h2 {

            font-size: 22px;

            font-weight: 500;

            margin-bottom: 7px;

            text-align: center;
        }


        .subtitle {

            text-align: center;

            font-size: 12px;

            color:
                rgba(255, 255, 255, 0.68);

            margin-bottom: 25px;
        }


        .error {

            padding: 9px 11px;

            margin-bottom: 15px;

            border-radius: 7px;

            background:
                rgba(220, 38, 38, 0.20);

            border:
                1px solid
                rgba(255, 180, 180, 0.35);

            color: #ffe4e4;

            font-size: 12px;
        }


        label {

            display: block;

            margin-bottom: 6px;

            font-size: 12px;

            color:
                rgba(255, 255, 255, 0.82);
        }


        input {

            width: 100%;

            height: 43px;

            padding: 0 13px;

            margin-bottom: 15px;

            border-radius: 8px;

            border:
                1px solid
                rgba(255, 255, 255, 0.28);

            outline: none;

            background:
                rgba(255, 255, 255, 0.10);

            color: white;

            font-family: inherit;

            font-size: 13px;

            transition: 0.2s;
        }


        input::placeholder {

            color:
                rgba(255, 255, 255, 0.52);
        }


        input:focus {

            background:
                rgba(255, 255, 255, 0.16);

            border-color:
                rgba(255, 255, 255, 0.65);

            box-shadow:
                0 0 0 3px
                rgba(10, 124, 255, 0.20);
        }


        .login-button {

            width: 100%;

            height: 43px;

            border: none;

            border-radius: 8px;

            background: #0a7cff;

            color: white;

            font-family: inherit;

            font-size: 13px;

            font-weight: 500;

            cursor: pointer;

            transition: 0.2s;

            box-shadow:
                0 7px 20px
                rgba(10, 124, 255, 0.30);
        }


        .login-button:hover {

            background: #0662cc;

            transform: translateY(-1px);
        }


        /* FORGOT PASSWORD */

        .forgot-password {

            text-align: center;

            margin-top: 12px;

            margin-bottom: 4px;
        }


        .forgot-password a {

            color: #58a6ff;

            text-decoration: none;

            font-size: 11px;

            font-weight: 500;
        }


        .forgot-password a:hover {

            color: white;

            text-decoration: underline;
        }


        .admin-button {

            display: block;

            width: 100%;

            height: 43px;

            line-height: 43px;

            margin-top: 12px;

            text-align: center;

            text-decoration: none;

            border-radius: 8px;

            border:
                1px solid
                rgba(255, 255, 255, 0.25);

            background:
                rgba(3, 10, 36, 0.45);

            color: white;

            font-size: 13px;

            transition: 0.2s;
        }


        .admin-button:hover {

            background:
                rgba(20, 35, 122, 0.70);
        }


        .customer-section {

            margin-top: 19px;

            padding-top: 15px;

            border-top:
                1px solid
                rgba(255, 255, 255, 0.18);

            text-align: center;

            font-size: 12px;

            color:
                rgba(255, 255, 255, 0.65);
        }


        .customer-link {

            margin-left: 4px;

            color: #58a6ff;

            text-decoration: none;

            font-weight: 500;
        }


        .customer-link:hover {

            color: white;

            text-decoration: underline;
        }


        @media (max-width: 850px) {

            .login-page {

                justify-content: center;

                padding: 76px 20px 30px;
            }


            .home-button {

                top: 20px;

                left: 20px;
            }


            .brand-content {

                display: none;
            }


            .login-card {

                width: 100%;

                max-width: 350px;
            }
        }


        @media (max-width: 450px) {

            .login-card {

                padding: 28px 24px;

            }
        }

    </style>

</head>


<body>


<div class="login-page">


    <!-- HOME BUTTON -->

    <a href="/" class="home-button">

        <svg viewBox="0 0 24 24" aria-hidden="true">

            <path d="M19 12H5M12 19l-7-7 7-7" />

        </svg>

        home

    </a>


    <div class="brand-content">

        <div class="brand-name">

            VEHICLE SERVICE<span>.</span>

        </div>


        <h1>

            Staff Login

        </h1>


        <p>

            Manage customers, bookings and service history.

        </p>

    </div>


    <div class="login-card">


        <h2>

            Login to your account

        </h2>


        <p class="subtitle">

            Staff access portal

        </p>


        {% if error %}

            <p class="error">

                {{ error }}

            </p>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <label for="username">

                Username

            </label>


            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >


            <label for="password">

                Password

            </label>


            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Enter your password" 
                autocomplete="current-password" 
                required
            >


            <button type="submit" class="login-button">

                Login

            </button>


        </form>


        <div class="forgot-password">

            <a href="{% url 'forgot_password' %}">

                Forgot Password?

            </a>

        </div>


    </div>


</div>


</body>

</html>
