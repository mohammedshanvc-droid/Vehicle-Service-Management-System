<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Password Reset Successful</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: "Poppins", sans-serif;

            background-image:
                linear-gradient(
                    90deg,
                    rgba(3, 10, 36, 0.40),
                    rgba(3, 10, 36, 0.65)
                ),
                url("/media/vehicle_images/loginnew.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            color: white;
        }

        .success-card {

            width: 380px;

            padding: 40px 32px;

            text-align: center;

            border-radius: 18px;

            background:
                rgba(255, 255, 255, 0.13);

            border:
                1px solid
                rgba(255, 255, 255, 0.30);

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.40);
        }

        .success-icon {

            width: 70px;

            height: 70px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: rgba(34, 197, 94, 0.18);

            border:
                1px solid
                rgba(134, 239, 172, 0.45);

            color: #86efac;

            font-size: 35px;

            font-weight: 600;
        }

        h2 {

            font-size: 23px;

            font-weight: 500;

            margin-bottom: 12px;
        }

        .message {

            font-size: 13px;

            line-height: 1.7;

            color:
                rgba(255, 255, 255, 0.72);

            margin-bottom: 28px;
        }

        .login-button {

            display: block;

            width: 100%;

            height: 44px;

            line-height: 44px;

            border-radius: 8px;

            background: #0a7cff;

            color: white;

            text-decoration: none;

            font-size: 13px;

            font-weight: 500;

            transition: 0.2s;

            box-shadow:
                0 7px 20px
                rgba(10, 124, 255, 0.30);
        }

        .login-button:hover {

            background: #0662cc;

            transform: translateY(-1px);
        }

    </style>

</head>


<body>

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <h2>
            Password Reset Successful
        </h2>

        <p class="message">
            Your staff account password has been changed successfully.
            You can now login using your new password.
        </p>

        <a
            href="{% url 'user_login' %}"
            class="login-button"
        >
            Back to Staff Login
        </a>

    </div>

</body>

</html>
